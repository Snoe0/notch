# Official releases: on a `v*` tag, build, Developer ID-sign, notarize, staple,
# checksum, attest, and publish build/Notch.dmg to a GitHub Release.
#
# All signing material lives in repository secrets, which GitHub withholds from
# forks and from pull requests: a fork running this workflow fails at the
# secrets check instead of publishing anything, so only this repository can
# produce builds that verify as the owner. The workflow fails loudly on the
# first missing secret rather than ever shipping an unsigned DMG.
#
# Required secrets (docs/RELEASING.md walks through creating each one):
#   MACOS_CERT_P12        base64 of the exported Developer ID Application .p12
#   MACOS_CERT_PASSWORD   password chosen when exporting the .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Jane Doe (TEAMID123)"
#   APPLE_API_KEY         contents of the App Store Connect AuthKey_XXXXXX.p8
#   APPLE_API_KEY_ID      the API key id, e.g. ABCD123456
#   APPLE_API_ISSUER_ID   issuer UUID from App Store Connect → Integrations

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Swift 6 needs Xcode 16 or newer. Kept in step with ci.yml.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Test
        run: swift test

      # Fail before building anything if any release secret is absent.
      - name: Check release secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY \
                      APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "missing secret $name — see docs/RELEASING.md" >&2
              exit 1
            fi
          done
          echo "all release secrets present"

      # A throwaway keychain holds the certificate for this run only; the
      # always() step at the end deletes it.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and sign app
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          ./Scripts/bundle.sh
          codesign --verify --strict --verbose=2 build/Notch.app

      - name: Make and sign DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./Scripts/make-dmg.sh

      - name: Notarize and staple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$APPLE_API_KEY_PATH"
          ./Scripts/notarize.sh build/Notch.dmg
          rm -f "$APPLE_API_KEY_PATH"

      - name: Verify signature and staple
        run: |
          xcrun stapler validate build/Notch.dmg
          spctl -a -t open --context context:primary-signature -v build/Notch.dmg

      - name: Generate checksums
        run: |
          cd build
          shasum -a 256 Notch.dmg > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/Notch.dmg

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

      # workflow_dispatch from a branch exercises the whole pipeline without
      # publishing; only real `v*` tags create a release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/Notch.dmg build/checksums.txt --clobber
          else
            gh release create "$TAG" build/Notch.dmg build/checksums.txt \
              --title "Notch $TAG" --generate-notes
          fi
